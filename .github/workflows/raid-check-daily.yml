name: Raid Boss Watcher
 
on:
  workflow_dispatch: {}
 
permissions:
  contents: write
 
jobs:
  check-raids:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Run raid watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # All watchlists combined into one run so there's a single
          # watch_raids.py invocation and a single seen.json to persist.
          WATCH_POKEMON: ${{ format('{0},{1},{2}', vars.WATCH_POKEMON, vars.WATCH_POKEMON_SHADOW, vars.WATCH_POKEMON_MEGA}}
        run: python3 watch_raids.py
 
      - name: Persist seen.json
        run: |
          git config user.name "raid-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen.json [skip ci]"
          git pull --rebase --autostash
          git push
