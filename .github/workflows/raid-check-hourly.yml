name: Event Check

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: event-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_MAX: ${{ secrets.DISCORD_WEBHOOK_URL_MAX }}
          DISCORD_WEBHOOK_URL_EVENTS: ${{ secrets.DISCORD_WEBHOOK_URL_EVENTS }}
          WATCH_POKEMON: ${{ vars.WATCH_POKEMON }}
          NOTIFY_WHEN_LEAVES: ${{ vars.NOTIFY_WHEN_LEAVES }}
          EVENT_TIMEZONE: ${{ vars.EVENT_TIMEZONE }}
        run: python3 watch_events.py

      - name: Persist state
        run: |
          git config user.name "raid-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json events_state.json
          git diff --staged --quiet || git commit -m "Update watcher state [skip ci]"
          git pull --rebase --autostash
          git push
