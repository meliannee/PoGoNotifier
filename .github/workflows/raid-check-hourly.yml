name: Max Events Watcher Daily

on:
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  check-max-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run max events watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_TIMEZONE: ${{ vars.EVENT_TIMEZONE }}
        run: python3 watch_max_events.py

      - name: Persist state file
        run: |
          git config user.name "max-events-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add max_events_state.json
          git diff --staged --quiet || git commit -m "Update max_events_state.json [skip ci]"
          git pull --rebase --autostash
          git push
