name: Raid Boss Watcher

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated seen.json

jobs:
  check-raids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run raid watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCH_POKEMON: ${{ vars.WATCH_POKEMON }}   # e.g. "Zacian,Mega Venusaur,Xerneas"
        run: python3 watch_raids.py

      - name: Persist seen.json
        run: |
          git config user.name "raid-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen.json [skip ci]"
          git push
